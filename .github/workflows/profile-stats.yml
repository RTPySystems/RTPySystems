name: Atualizar cards do perfil

on:
  schedule:
    - cron: '29 12 * * *' # 09:29, America/Recife; PNG estático, sem serviço de cards externo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Instalar renderizador
        run: pip install -r scripts/requirements.txt
      - name: Testar cálculo dos cards
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Gerar PNGs com dados públicos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USERNAME: RTPySystems
        run: python scripts/update_stats.py
      - name: Publicar apenas os cards
        run: |
          git config user.name 'RTPySystems'
          git config user.email '120159269+RTPySystems@users.noreply.github.com'
          git add assets/github-stats.png assets/github-languages.png
          if ! git diff --cached --quiet; then
            git commit -m 'chore: atualiza cards públicos do perfil'
            git push
          fi
